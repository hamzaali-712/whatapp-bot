# User selected Free compute. Supabase preserves encrypted WhatsApp auth.
services:
  - type: web
    name: whatapp-bot
    runtime: node
    repo: https://github.com/hamzaali-712/whatapp-bot
    branch: main
    plan: free
    region: singapore
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.0
      - key: WHATSAPP_SESSION_ID
        value: main
      - key: API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTH_ENCRYPTION_KEY
        sync: false
